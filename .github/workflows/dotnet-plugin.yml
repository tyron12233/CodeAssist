name: C# plugin release

# Builds the C# plugin (samples/dotnet-plugin) as one release-signed APK per ABI and attaches them to a CodeAssist
# release as CodeAssist-CSharp-Plugin-<version>-<abi>.apk.
#
# The .NET runtime and compiler inside it are assembled here, by tools/dotnet-toolchain/build-dotnet-android.sh:
# Microsoft's published packages, each checked against the SHA-256 recorded in that script, plus OpenSSL and
# the launcher built from source with the NDK. That takes a few minutes, so there is no separate toolchain
# workflow or prerelease to keep in step.
#
# Runs when a release is published (tags v*), and by hand: with a tag it attaches to that release, without one
# it only builds, and the APKs are this run's artifacts.
#
# Signing uses the IDE's upload key, from the repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD,
# RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD. This workflow never runs for a pull request.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APKs to (e.g. v3.47.0); empty to only build
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: dotnet-plugin-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  # The ABIs Microsoft publishes an Android runtime for. There is none for 32-bit devices.
  ABIS: "arm64-v8a x86_64"

jobs:
  plugin:
    name: Release APKs
    # An app release only: prereleases created by other workflows are not app versions.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The release's own commit, so the plugin matches the app it ships with.
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-36.1 build-tools;36.0.0"

      - name: Assemble the .NET toolchain
        run: |
          for abi in $ABIS; do
            HOST_ABI="$abi" tools/dotnet-toolchain/build-dotnet-android.sh
            out="tools/dotnet-toolchain/build/out/$abi"
            test -f "$out/jniLibs/$abi/libdotnetlaunch.so" || { echo "no launcher for $abi" >&2; exit 1; }
            test -f "$out/assets/dotnet-sdk.zip" || { echo "no .NET tree for $abi" >&2; exit 1; }
          done

      - name: Disable Kotlin incremental compilation (CI)
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.incremental=false" >> ~/.gradle/gradle.properties

      - name: Run the plugin's unit tests
        run: ./gradlew :samples:dotnet-plugin:testDebugUnitTest --console=plain --stacktrace

      # The keystore is written outside the checkout and only for the build step's lifetime. One build per ABI:
      # the runtime's native libraries are in the asset archive, so an APK serves exactly one ABI.
      - name: Build the release APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          [[ -n "$RELEASE_KEYSTORE_BASE64" ]] || { echo "RELEASE_KEYSTORE_BASE64 is not set: the APKs would be unsigned" >&2; exit 1; }
          export RELEASE_STORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_STORE_FILE"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          mkdir -p "$RUNNER_TEMP/apks"
          for abi in $ABIS; do
            ./gradlew :samples:dotnet-plugin:assembleRelease "-Pdotnet.abi=$abi" --console=plain --stacktrace
            cp samples/dotnet-plugin/build/outputs/apk/release/dotnet-plugin-release.apk "$RUNNER_TEMP/apks/$abi.apk"
          done

      - name: Check and name the APKs
        id: apks
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' samples/dotnet-plugin/src/main/res/raw/codeassist_plugin.toml | head -1)"
          [[ -n "$version" ]] || { echo "no version in codeassist_plugin.toml" >&2; exit 1; }
          mkdir -p dist
          for abi in $ABIS; do
            apk="$RUNNER_TEMP/apks/$abi.apk"
            "$apksigner" verify "$apk"
            unzip -l "$apk" | grep -q "lib/$abi/libdotnetlaunch.so" || { echo "the $abi APK has no launcher" >&2; exit 1; }
            unzip -l "$apk" | grep -q "assets/dotnet-sdk.zip" || { echo "the $abi APK has no .NET tree" >&2; exit 1; }
            cp "$apk" "dist/CodeAssist-CSharp-Plugin-$version-$abi.apk"
          done
          "$apksigner" verify --print-certs "dist/CodeAssist-CSharp-Plugin-$version-arm64-v8a.apk" | grep -m1 SHA-256
          ls -la dist
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-plugin-release
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to ${{ env.TAG }}
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apks.outputs.version }}
        run: |
          gh release upload "$TAG" dist/*.apk --clobber
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          # The catalog row the Get plugins page reads (Supabase public.plugin_catalog): every ABI's build, and
          # the plain link (what older apps read) on arm64.
          json="{"
          for abi in $ABIS; do
            f="dist/CodeAssist-CSharp-Plugin-$VERSION-$abi.apk"
            json="$json\"$abi\": {\"url\": \"$base/$(basename "$f")\", \"size\": $(stat -c %s "$f")},"
          done
          json="${json%,}}"
          arm64="dist/CodeAssist-CSharp-Plugin-$VERSION-arm64-v8a.apk"
          {
            echo "Attached to [$TAG](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG)."
            echo
            echo "Catalog update (Supabase SQL editor; the row comes from the plugin_catalog_csharp migration):"
            echo
            echo '```sql'
            echo "update public.plugin_catalog set"
            echo "  version = '$VERSION',"
            echo "  download_url = '$base/$(basename "$arm64")',"
            echo "  size_bytes = $(stat -c %s "$arm64"),"
            echo "  page_url = 'https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG',"
            echo "  abi_downloads = '$json'::jsonb,"
            echo "  visible = true,"
            echo "  updated_at = now()"
            echo "where id = 'dev.codeassist.csharp';"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

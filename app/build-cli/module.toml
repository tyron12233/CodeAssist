version = 2

[module]
type = "java-lib"
name = "build-cli"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/kotlin"]

[dependencies]
implementation = [{ module = "ide-core" }, "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0", "com.android.tools.build:bundletool:1.18.3", "org.bouncycastle:bcpkix-jdk18on:1.78.1", "kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.4.0", { module = "test-support" }, "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"]

version = 2

[module]
type = "java-lib"
name = "ide-desktop"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/kotlin"]

[dependencies]
implementation = [{ module = "ide-core" }, { module = "interp-compose" }, { module = "android-support" }, { module = "layout-preview-impl" }, "org.jetbrains.compose.desktop:desktop-jvm-macos-arm64:1.11.1", "org.jetbrains.compose.material3:material3:1.9.0", "org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.11.0", "com.android.tools.build:bundletool:1.18.3", "org.bouncycastle:bcpkix-jdk18on:1.78.1", "kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.4.0", { module = "test-support" }]

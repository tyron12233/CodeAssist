org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
kotlin.code.style=official

# :ide-ui declares a custom `jvmShared` intermediate source set (shared by the desktop + android targets so
# it can depend on the plain-JVM layout-preview-api). Explicit dependsOn edges conflict with the default
# Kotlin hierarchy template, so it stays off and every intermediate set is wired by hand. That now includes
# the UI modules' `iosMain`: with the template disabled nothing creates an apple/ios set implicitly, so a
# module carrying iOS actuals declares one and points its ios target's main set at it.
kotlin.mpp.applyDefaultHierarchyTemplate=false

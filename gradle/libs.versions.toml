[versions]
kotlin = "2.4.0"
# The unshaded compiler (`-for-ide` artifacts) and the IntelliJ platform version it is built against (Kotlin
# 2.4.0's gradle.properties pins versions.intellijSdk to the same 251.27812.49). This pair must move together,
# and matches what KSP2 main pins. Consumed by :kotlin-compiler-deps. Served from packages.jetbrains.team
# (`p/ij/intellij-dependencies`), NOT Maven Central.
kotlinForIde = "2.4.20-dev-6138"
intellijPlatform = "251.27812.49"
coroutines = "1.10.2"
junit = "5.11.4"
jdt = "3.40.0"
compose = "1.11.1"
agp = "9.2.1"
activityCompose = "1.13.0"
androidxCore = "1.13.1"   # androidx.core — provides FileProvider for sharing app-private files
androidxTestRunner = "1.6.2"      # androidx.test:runner — AndroidJUnitRunner for connectedAndroidTest
androidxTestExtJunit = "1.2.1"    # androidx.test.ext:junit — JUnit4 + AndroidJUnit4 on device
# Pure-Java Android build tools, invoked IN-PROCESS (no `java -jar`) so they run on ART when statically
# linked into the app. On desktop they're test-only; :ide-android bundles them (see android-support).
r8 = "8.13.19"        # com.android.tools.r8.D8 — the dexer
apksig = "8.7.3"      # com.android.apksig.ApkSigner — APK v1/v2/v3 signing
bundletool = "1.18.3" # com.android.tools.build.bundletool — builds the .aab (aligns with AGP 9.x's bundletool)
guava = "32.0.1-jre"  # com.google.common.* — bundletool's collections (ImmutableList) at compile time
asm = "9.7"           # org.ow2.asm — bytecode rewrite of System.exit for the in-process Java dex-run
trove4j = "1.0.20200330"  # gnu.trove.* — IntelliJ-core dependency the Kotlin compiler needs but doesn't bundle
desugarJdkLibs = "2.1.5"  # com.android.tools:desugar_jdk_libs — core-library desugaring (temporarily enabled)
bouncycastle = "1.78.1"   # org.bouncycastle — in-process keystore creation (keypair + self-signed X.509) on ART (no keytool)
playServicesAds = "25.4.0"  # com.google.android.gms:play-services-ads — AdMob native ads + mediation (Android launcher only). 25.4.0 is the floor the current native-capable mediation adapters require.
userMessagingPlatform = "4.0.0"        # com.google.android.ump — UMP/GDPR consent SDK; gathers consent before MobileAds.initialize (mediation prerequisite, EEA/UK)
admobMediationMeta = "6.22.0.0"        # com.google.ads.mediation:facebook — Meta Audience Network adapter (native-capable)
admobMediationPangle = "8.2.0.4.0"     # com.google.ads.mediation:pangle — Pangle adapter (native-capable)
admobMediationMintegral = "17.1.71.0"  # com.google.ads.mediation:mintegral — Mintegral adapter (native-capable)
androidStub = "4.1.1.4"     # com.google.android:android — the throwaway stub android.jar (compileOnly) :applog-runtime compiles against
okhttp = "4.12.0"           # com.squareup.okhttp3 — HTTP + SSE transport for the agent's LLM client (:agent-impl); runs on JVM and ART
cfr = "0.152"               # org.benf:cfr — single-jar Java decompiler for the "navigate into library class" view (:decompiler). Chosen over Fernflower/Vineflower because those NPE on ART (their plugin loader calls Class.getProtectionDomain(), null on Android); CFR is self-contained and runs on-device.
# KSP2 (Kotlin Symbol Processing, standalone Analysis-API runner). 2.3.10 explicitly supports Kotlin 2.4.0
# ("Sanitize ':' in internal-name module suffix so KSP works with Kotlin 2.4.0 default module names", #2964)
# and bundles kotlinx.coroutines into the -aa-embeddable uber jar (#2938). The `-aa-embeddable` runner renames
# its bundled Analysis API / IntelliJ platform, so it coexists on a classpath with :kotlin-compiler-deps'
# unshaded `-for-ide` compiler without a name clash. Standalone entry: KotlinSymbolProcessing(KSPJvmConfig,
# providers, logger).execute(). See docs/kotlin-compiler-plugins-and-codegen.md.
ksp = "2.3.10"
# Room is the reference bundled KSP processor. 2.8.x is the KSP2-based line (drops KSP1/kapt), so it pairs
# with the KSP2 runner above; room-runtime/-common go on the compile classpath, room-compiler on the
# processor classpath.
room = "2.8.4"
# The other blessed bundled KSP processors. Each ships its processor's closure as /processors/<id>.zip and
# activates on a classpath probe of its runtime (Compose-plugin style — add the runtime, the processor runs).
moshi = "1.15.2"   # com.squareup.moshi — moshi-kotlin-codegen (KSP-native JSON adapters)
glide = "5.0.9"    # com.github.bumptech.glide — the `ksp` processor + `annotations` (@GlideModule) marker
dagger = "2.60.1"  # com.google.dagger — Hilt/Dagger; hilt-compiler is the KSP processor, hilt-core the marker

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
jdt-core = { module = "org.eclipse.jdt:org.eclipse.jdt.core", version.ref = "jdt" }
# ecj (the standalone Eclipse compiler) arrives transitively via jdt.core; named here so :ide-android
# can resolve it on its own and feed it to the ART bytecode-relocation task (see RelocateTypesInJar).
jdt-ecj = { module = "org.eclipse.jdt:ecj", version.ref = "jdt" }
# org.eclipse.core.contenttype — JDT's public DOM/JavaCore path touches IContentTypeManager at class-load
# time. It normally arrives transitively via org.eclipse.core.runtime, but :ide-android excludes that
# (to swap in a StackWalker-relocated copy), which drops contenttype too. Name it here so :ide-android can
# add it back explicitly. Version tracks what jdt.core 3.40.0 resolves transitively. See RelocateTypesInJar.
eclipse-contenttype = { module = "org.eclipse.platform:org.eclipse.core.contenttype", version = "3.9.600" }
# org.eclipse.core.jobs — the public DOM ASTParser constructor reads DefaultWorkingCopyOwner.PRIMARY, whose
# enclosing IJavaElement/working-copy hierarchy reaches org.eclipse.core.runtime.jobs.ISchedulingRule at
# class-load time. It normally arrives transitively via org.eclipse.core.runtime, which :ide-android excludes
# (to swap in a StackWalker-relocated copy), dropping core.jobs too. ART links class hierarchies more eagerly
# than HotSpot, so the missing ISchedulingRule is an uncatchable NoClassDefFoundError that kills editor
# analysis + source indexing. Add it back explicitly; it is a plain jar (no StackWalker/Runtime$Version refs),
# so dex as-is. Version tracks what jdt.core 3.40.0 resolves transitively.
eclipse-jobs = { module = "org.eclipse.platform:org.eclipse.core.jobs", version = "3.15.400" }
# kotlin-metadata-jvm is a small, compiler-free library that decodes Kotlin libraries' @Metadata to recover
# real Kotlin signatures (extensions, properties, default args, nullability). Tracks the Kotlin version.
# (The compiler/PSI itself comes from :kotlin-compiler-deps, the unshaded `-for-ide` split; the old
# kotlin-compiler-embeddable is gone so the editor and the K2 Analysis API share ONE IntelliJ platform.)
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
# The Jetpack Compose kotlinc compiler plugin, in its UNSHADED `-for-ide` build (matches the -for-ide
# compiler in :kotlin-compiler-deps; the `-embeddable` variant links the relocated org.jetbrains.kotlin.com.
# intellij.* world and cannot load in the unshaded compiler). Fed to the in-process K2JVMCompiler via
# `-Xplugin` when a module depends on the Compose runtime, so a real @Composable build emits the
# plugin-transformed bytecode. Bundled as a lang-kotlin resource jar (for the service descriptor + desktop
# class-load) AND dexed into :ide-android (so its registrar resolves on ART).
kotlin-compose-compiler-plugin-ide = { module = "org.jetbrains.kotlin:compose-compiler-plugin-for-ide", version.ref = "kotlinForIde" }
# The kotlinx.serialization kotlinc compiler plugin (unshaded `-for-ide` build, matching the compiler world of
# :kotlin-compiler-deps). Bundled as a lang-kotlin resource jar AND dexed into :ide-android like the Compose
# plugin, so a module carrying the serialization runtime is compiled with it — no runtime DexClassLoader.
kotlin-serialization-compiler-plugin-ide = { module = "org.jetbrains.kotlin:kotlinx-serialization-compiler-plugin-for-ide", version.ref = "kotlinForIde" }
# The kotlin-parcelize kotlinc compiler plugin (unshaded `-for-ide` build). Bundled + dexed like the Compose
# and serialization plugins so a module with `@Parcelize` compiles without a runtime DexClassLoader. Enabled
# via the module's Build Features toggle (which adds the kotlin-parcelize runtime the plugin's probe detects).
kotlin-parcelize-compiler-plugin-ide = { module = "org.jetbrains.kotlin:parcelize-compiler-plugin-for-ide", version.ref = "kotlinForIde" }
# The kotlinx.serialization RUNTIME (independent of the compiler-plugin version). Test-only in :lang-kotlin:
# KotlinSerializationBuildTest compiles a @Serializable class against it (with the bundled plugin) and asserts
# the generated serializer; self-gates when the jar isn't resolvable, so a stripped CI classpath skips it.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.8.1" }
# The Kotlin standard library JAR, bundled as an :ide-android asset so the on-device K2JVMCompiler spike has
# stdlib on its compile classpath (the dexed app classes aren't usable as a -classpath input). Tracks `kotlin`.
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
# gnu.trove.* — IntelliJ-core (and thus the embedded Kotlin compiler) references it un-relocated but does
# not bundle it; dexed into :ide-android so the on-device compiler resolves it.
trove4j = { module = "org.jetbrains.intellij.deps:trove4j", version.ref = "trove4j" }
# Compose Multiplatform runtime (JVM/desktop variant), used as a test-only compile classpath so the
# KotlinJvmCompiler @Composable-transform test has the real `androidx.compose.runtime.*` to compile against.
compose-runtime-desktop = { module = "org.jetbrains.compose.runtime:runtime-desktop", version.ref = "compose" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
android-r8 = { module = "com.android.tools:r8", version.ref = "r8" }
android-apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
android-bundletool = { module = "com.android.tools.build:bundletool", version.ref = "bundletool" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
desugar-jdk-libs-configuration = { module = "com.android.tools:desugar_jdk_libs_configuration", version.ref = "desugarJdkLibs" }
ow2-asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
ow2-asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
ow2-asm-commons = { module = "org.ow2.asm:asm-commons", version.ref = "asm" } # ClassRemapper/Remapper — bridge reparent + type remap
cfr = { module = "org.benf:cfr", version.ref = "cfr" }
# Bouncy Castle: generate an RSA keypair + self-signed X.509 cert and write a PKCS12 keystore IN-PROCESS, so
# users can create signing keystores on-device (ART has no `keytool`). compileOnly+test in :android-support,
# bundled into the launchers (:ide-android, :ide-desktop). bcpkix pulls bcprov transitively.
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# AdMob native ads, Android launcher only (:ide-android). Ads are rendered through the AdHost seam; no other
# module links this. Test ad unit IDs are used until real ones are provided.
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "playServicesAds" }
# UMP consent SDK + AdMob mediation adapters (Android launcher only). The adapters let Meta/Pangle/Mintegral
# BID to fill the SAME native ad slots AdMob already serves — higher eCPM through network competition, no new
# ad placements. Only NATIVE-capable networks are wired (AppLovin removed native inventory, so it would fill
# nothing here). Each adapter drags its network SDK in transitively and requires play-services-ads >= 25.4.0.
user-messaging-platform = { module = "com.google.android.ump:user-messaging-platform", version.ref = "userMessagingPlatform" }
admob-mediation-meta = { module = "com.google.ads.mediation:facebook", version.ref = "admobMediationMeta" }
admob-mediation-pangle = { module = "com.google.ads.mediation:pangle", version.ref = "admobMediationPangle" }
admob-mediation-mintegral = { module = "com.google.ads.mediation:mintegral", version.ref = "admobMediationMintegral" }
# The stub android.jar (every method throws "Stub!"): compileOnly for :applog-runtime, whose tiny debug
# log-bridge (ContentProvider + LocalSocket forwarder) is compiled against the framework APIs but never links
# them (they resolve against the real android.jar when the runtime jar is dexed into a user's app). Ancient
# API level, but ContentProvider/LocalSocket/Process/Log have existed since API 1, so it suffices and keeps
# :applog-runtime buildable with no Android SDK (CI_CORE_ONLY).
android-stub = { module = "com.google.android:android", version.ref = "androidStub" }
# OkHttp + its SSE companion: the agent's LLM client (:agent-impl) POSTs chat requests and reads the
# provider's Server-Sent-Events stream through EventSource. One transport for all providers, identical on
# desktop and ART (bundled into :ide-android like the other in-process tools). okhttp-sse tracks okhttp.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-sse = { module = "com.squareup.okhttp3:okhttp-sse", version.ref = "okhttp" }
# KSP2 standalone runner. `symbol-processing-api` = the processor SPI (SymbolProcessor/…Provider/KSPLogger/
# Resolver/CodeGenerator), on the compile classpath so a bundled processor and our runner see the types.
# `symbol-processing-common-deps` = KSPConfig/KSPJvmConfig. `symbol-processing-aa-embeddable` = the ~78 MB
# uber-jar runner (renamed Analysis API). Desktop: real jars. ART (:ide-android): dexed like the compiler.
ksp-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
ksp-common-deps = { module = "com.google.devtools.ksp:symbol-processing-common-deps", version.ref = "ksp" }
ksp-aa-embeddable = { module = "com.google.devtools.ksp:symbol-processing-aa-embeddable", version.ref = "ksp" }
# The NON-embeddable runner: same uber jar but with the Analysis API left UN-relocated (`org.jetbrains.kotlin.
# analysis.*`). Used by the thin-KSP spike, which extracts only KSP's own `com.google.devtools.ksp.**` classes
# from it and links them against OUR bundled AA (:kotlin-compiler-deps) instead of its own — the path to a
# <100 MB base APK (reuse the compiler we already ship, no second 78 MB platform).
ksp-aa = { module = "com.google.devtools.ksp:symbol-processing-aa", version.ref = "ksp" }
# Room: the reference bundled processor. room-compiler is the KSP `SymbolProcessorProvider` (processor
# classpath); room-runtime carries the annotations + RoomDatabase the generated code and the user compile
# against. Test-only in :lang-ksp (the Room desktop spike); self-gates when unresolvable.
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
# The other blessed processors: `*-compiler`/`ksp` = the bundled KSP processor closure; the runtime module
# (moshi/glide-annotations/hilt-core) carries the marker class the catalog probes to auto-activate it.
moshi-kotlin-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
moshi-runtime = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
glide-ksp = { module = "com.github.bumptech.glide:ksp", version.ref = "glide" }
glide-annotations = { module = "com.github.bumptech.glide:annotations", version.ref = "glide" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "dagger" }
hilt-core = { module = "com.google.dagger:hilt-core", version.ref = "dagger" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# kotlinx.serialization compiler plugin — generates serializers for the agent's @Serializable provider
# DTOs (:agent-impl). Ships in the Kotlin gradle-plugin artifact, so its version tracks `kotlin`.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9's KMP library plugin: configures a Kotlin Multiplatform module's Android target inside `kotlin {}`.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

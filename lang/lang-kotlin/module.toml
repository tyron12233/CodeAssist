version = 2

[module]
type = "java-lib"
name = "lang-kotlin"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/java", "src/test/kotlin"]

[dependencies]
api = [{ module = "language-api" }, { module = "lang-kotlin-index" }]
implementation = [{ module = "index-api" }, { module = "analysis-api" }, { module = "build-engine" }, { module = "kotlin-compiler-deps" }, { module = "intellij-psi-host" }, "org.jetbrains.kotlin:kotlin-metadata-jvm:2.4.0", "org.ow2.asm:asm:9.7", "kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.4.0", { module = "test-support" }, { module = "project-model-impl" }, { module = "index-impl" }, { module = "bench-support" }, "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0", "org.jetbrains.compose.runtime:runtime-desktop:1.11.1", "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1", "org.jetbrains.kotlin:kotlin-parcelize-runtime:2.4.0"]

version = 2

[module]
type = "java-lib"
name = "plugin-api"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/commonMain/kotlin", "src/jvmMain/kotlin"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/jvmTest/kotlin"]

[dependencies]
api = [{ module = "platform-core" }]
implementation = ["kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.4.0", { module = "test-support" }, "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"]

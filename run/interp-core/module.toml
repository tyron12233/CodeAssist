version = 2

[module]
type = "java-lib"
name = "interp-core"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/kotlin"]
resources = ["src/test/resources"]

[dependencies]
api = [{ module = "lang-kotlin" }]
implementation = ["kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.4.0", { module = "test-support" }, { module = "kotlin-compiler-deps" }]

version = 2

[module]
type = "java-lib"
name = "vcs-impl"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.main]
scope = "IMPLEMENTATION"
java = ["src/main/kotlin"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/kotlin"]

[dependencies]
api = [{ module = "vcs-api" }]
implementation = [{ module = "platform-core" }, "org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r", "com.squareup.okhttp3:okhttp:4.12.0", "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1", "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0", "kotlin-stdlib"]
testImplementation = [{ platform = "org.junit:junit-bom:5.11.4" }, "org.jetbrains.kotlin:kotlin-test:2.4.0", { module = "test-support" }]

version = 2

[module]
type = "java-lib"
name = "zipcli-ui"
languageLevel = "JAVA_17"
output = "build/codeassist/classes"

[sourceSets.commonMain]
scope = "IMPLEMENTATION"
java = ["src/commonMain/kotlin"]

[sourceSets.jvmShared]
scope = "IMPLEMENTATION"
java = ["src/jvmShared/kotlin"]

[dependencies]
implementation = [{ module = "ide-ui" }, { module = "zipcli-core" }, "org.jetbrains.compose.runtime:runtime:1.11.1", "org.jetbrains.compose.foundation:foundation:1.11.1", "org.jetbrains.compose.material3:material3:1.9.0", "org.jetbrains.compose.ui:ui:1.11.1", "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0", "kotlin-stdlib"]

[kotlin]
commonSourceRoots = ["src/commonMain/kotlin", "src/jvmShared/kotlin"]

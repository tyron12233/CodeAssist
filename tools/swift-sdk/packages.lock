# The Termux packages the Swift plugin's toolchain is staged from, pinned: <arch> <package> <version> <pool path> <sha256>
#
# Termux serves only the latest version of a package, so these disappear from packages.termux.dev when Termux moves
# on. Every one is mirrored, under its pool file name with ':' made '.', on the swift-sdk-<swift version> prerelease
# of this repository, and fetch-swift-android.sh tries the mirror first. The checksum decides either way.
#
# `any` is a package whose staged part is the same for every ABI (clang: only its builtin headers are used).
